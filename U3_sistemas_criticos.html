### Sistemas críticos
Los **sistemas críticos** son sistemas cuya falla puede producir consecuencias graves para las personas, el medio ambiente, la economía, la seguridad o el funcionamiento de una organización. 

Por este motivo, además de cumplir con los requisitos funcionales, deben cumplir requisitos especialmente estrictos relacionados con su confiabilidad, disponibilidad, fiabilidad, seguridad y protección.

----

### Sistemas críticos
Algunos ejemplos son:

- Sistemas de control de aeronaves
- Sistemas de control ferroviario
- Sistemas médicos, como monitores de pacientes o equipos de radioterapia
- Sistemas de control de centrales eléctricas
- Sistemas de emergencia
- Sistemas bancarios y financieros
- Sistemas de control industrial
- Sistemas de comunicaciones de servicios esenciales

---

### Confiabilidad de un sistema

La **confiabilidad** *(dependability)* es la capacidad de un sistema de brindar un servicio en el que se pueda confiar.

No se refiere solamente a que el sistema funcione correctamente. Un sistema confiable debe continuar proporcionando un servicio adecuado incluso cuando se producen errores, fallos o situaciones inesperadas.

----

### Confiabilidad
<!-- .slide: style="font-size: 0.90em" -->
La confiabilidad es tanto o más importante que la funcionalidad porque:
- Las fallas del sistema afectan a un gran número de individuos y negocios.
- Los usuarios rechazan a menudo los sistemas que son poco fiables, carecen de pro-
tecciones o son inseguros. (y otros softwares de la misma empresa)
- Los costos por las fallas del sistema suelen ser enormes
- Los sistemas no confiables pueden causar pérdida de información. Los datos son
más costosos que el sistema donde se procesan.

----

### Confiabilidad
Al diseñar un sistema confiable se debe considerar:
- Falla del hardware por errores de diseño, fabricación, componentes o final de su vida operativa.
- Falla en el desarrollo de software debido a errores en su especificación, diseño o implementación.
- Falla de operación, uso incorrecto del sistema.

----

### Confiabilidad
<!-- .slide: style="font-size: 0.90em" -->
Para desarrollar software confiable es necesario garantizar que:
1. Se evite la entrada de errores accidentales en el sistema durante la especificación y
el desarrollo del software.
2. Se diseñen procesos de verificación y validación que sean efectivos en el descubrimiento de errores residuales que afecten la confiabilidad del sistema.
3. Se desarrollen mecanismos de protección contra ataques externos que comprometan
la disponibilidad o la seguridad del sistema.
4. Se configuren correctamente el sistema utilizado y el software de apoyo para su
entorno operacional.

----

### Confiabilidad
Aumentar la confiabilidad de un software aumenta el costo de su desarrollo.

![Costo vs Confiabilidad](images/unidad3-criticos/costo-confiabilidad.png)

### Confiabilidad de un sistema
La confiabilidad es un concepto amplio que engloba diferentes propiedades, entre ellas:

- **Disponibilidad:** el sistema debe estar disponible cuando se necesita.
- **Fiabilidad:** el sistema debe funcionar correctamente durante un período determinado.
- **Protección (safety):** las fallas del sistema no deben provocar consecuencias peligrosas.
- **Seguridad (security):** el sistema debe evitar accesos, modificaciones o usos no autorizados.

----

![Confiabilidad](images/unidad3-criticos/confiabilidad.png)

----

### Confiabilidad de un sistema
Por ejemplo, un sistema de control de un tren debe ser confiable porque no basta con que funcione normalmente: también debe comportarse de manera segura cuando alguno de sus componentes falla.

----

### La confiabilidad representa el grado de confianza que podemos depositar en que un sistema prestará correctamente el servicio esperado.

---

### Disponibilidad de un sistema

La **disponibilidad** *(availability)* representa la probabilidad de que un sistema esté operativo y disponible para prestar su servicio cuando sea necesario.

Un sistema puede tener una alta disponibilidad aunque ocasionalmente falle, siempre que pueda recuperarse rápidamente.

----

### Disponibilidad de un sistema
Por ejemplo, un servicio web que funciona durante 23 horas y 59 minutos al día y se recupera rápidamente ante una falla tiene una disponibilidad muy elevada.

----

### Disponibilidad de un sistema
Una forma habitual de expresarla es:

![Disponibilidad](images/unidad3-criticos/disponibilidad.png)
	​

Por ejemplo, si un sistema funciona durante 99 horas y permanece fuera de servicio durante 1 hora:

![Disponibilidad](images/unidad3-criticos/disponibilidad2.png)

----

### Disponibilidad de un sistema
La disponibilidad está relacionada principalmente con:
- **Prevención de fallos:** intentar evitar que ocurran.
- **Tolerancia a fallos:** continuar funcionando aunque ocurra un fallo.
- **Recuperación:** volver a funcionar rápidamente después de una falla.

----

La disponibilidad no sólo depende del número de caídas del sistema, sino también 
del tiempo necesario para reparar los componentes que causaron la falla.

---

### Fiabilidad de un sistema

La **fiabilidad** *(reliability)* es la capacidad de un sistema de funcionar correctamente y sin fallos durante un período determinado y bajo determinadas condiciones.

Un sistema puede fallar, recuperarse rápidamente y volver a funcionar. En ese caso puede tener una alta disponibilidad, pero una fiabilidad menor.

----

### Fiabilidad de un sistema
Por ejemplo:

- **Sistema A:** funciona durante 10 horas, falla durante 1 minuto y vuelve a funcionar.
- **Sistema B:** funciona durante 10 horas y no presenta ninguna falla.

Ambos pueden tener una disponibilidad elevada, pero el Sistema B presenta una mayor fiabilidad durante ese período.

----

### Fiabilidad de un sistema
La fiabilidad es especialmente importante cuando una falla puede tener consecuencias graves.

Por ejemplo, en un sistema de control de una aeronave no es suficiente con que el sistema pueda recuperarse rápidamente: es fundamental que funcione correctamente durante toda la operación.

----

### Fiabilidad
<!-- .slide: style="font-size: 0.90em" -->
Deben tomarse en cuenta tanto el entorno donde se usa el sistema y el propósito para el que se utiliza.

Cuando se discute la fiabilidad, es útil usar terminología precisa y distinguir:
- **Error o equivocación humano:** Introducción de fallas en el desarrollo del sistema. 
- **Falla en el desarrollo del sistema:** Sin una verificación no se puede asegurar que el sistema no fallara.
- **Error del sistema:** Un estado erróneo puede conducir a un comportamiento inesperado.
- **Caída del sistema:** El sistema no entrega un servicio como espera su usuario.

----

![Entradas y Salidas](images/unidad3-criticos/entradas-salidas.png)

----

### Fiabilidad
Enfoques complementarios para mejorar la fiabilidad:
1. **Prevención de fallas de desarrollo:** Se usan técnicas de desarrollo que minimizan
la posibilidad de los errores humanos, como el uso de análisis estático de código.
2. **Detección y eliminación de fallas en el desarrollo:** El uso de técnicas de verificación y validación.
3. **Tolerancia a fallas en el desarrollo:** Aseguran que las fallas no deriven en errores.
Incorporación de mecanismos de autocomprobación y uso de módulos redundantes.

### Fallas
Las fallas en el desarrollo no siempre derivan en errores del sistema, y los errores
del sistema no necesariamente originan caídas del sistema.
1. No todo el código en un programa se ejecuta.
2. Los errores son transitorios.
3. El sistema puede incluir mecanismos de detección de fallas y de protección, que
aseguran que el comportamiento erróneo se descubra y corrija antes de que resulten
afectados los servicios del sistema.

---

### Seguridad (Safety)

La **seguridad** *(Safety)* se refiere a la capacidad de un sistema para funcionar sin provocar daños inaceptables a las personas, al medio ambiente o a otros sistemas.

En sistemas críticos, una falla no solamente puede significar que el sistema deje de funcionar. Puede provocar un accidente.

----

### Seguridad (Safety)

Por ejemplo, consideremos un sistema de control ferroviario.

Si el sistema falla y simplemente deja de mostrar información, tenemos un problema de disponibilidad.

Pero si una falla provoca que dos trenes reciban autorización para ocupar simultáneamente la misma vía, estamos ante un problema de safety, porque la falla puede producir consecuencias peligrosas.

----

### Seguridad (Safety)

La seguridad busca:
- Identificar posibles situaciones peligrosas.
- Analizar las consecuencias de los fallos.
- Reducir la probabilidad de accidentes.
- Diseñar mecanismos para llevar el sistema a un estado seguro.
- Evitar que una falla produzca consecuencias catastróficas.

----

### Seguridad: Ejemplo

Un sistema de control de temperatura industrial puede tener como comportamiento seguro:

Si el sensor de temperatura presenta un valor imposible, el sistema detiene automáticamente el proceso.

En este caso, el sistema sacrifica disponibilidad para mantener la seguridad.

----

### Seguridad
Para garantizar la seguridad se debe:
1. **Evitar el peligro** Diseñar el sistema para reducir los riesgos. 
2. **Detectar y eliminar el peligro** antes de que ocasionen un accidente.
3. **Limitar el daño**

---

### Protección (Security)

La **protección** *(Security)* se refiere a la capacidad de un sistema para resistir accesos, usos, modificaciones, destrucción o divulgación no autorizados.

----

### Protección (Security)
Está relacionada con amenazas intencionales, como:
- Ataques informáticos.
- Accesos no autorizados.
- Robo de información.
- Modificación de datos.
- Código malicioso.
- Suplantación de identidad.
- Ataques de denegación de servicio.

----

### Protección (Security)
La protección busca preservar principalmente:
- **Confidencialidad:** solamente las personas autorizadas pueden acceder a la información.
- **Integridad:** la información no puede ser modificada de manera no autorizada.
- **Disponibilidad:** los servicios y datos deben permanecer accesibles para quienes están autorizados.

----

### Protección: Ejemplo

En un sistema bancario:
- Un usuario no autorizado no debe poder consultar una cuenta **→ confidencialidad**.
- Un atacante no debe poder modificar el saldo **→ integridad**.
- Los clientes deben poder utilizar el servicio cuando lo necesitan **→ disponibilidad**.

----

### Safety vs Security
Una falla de hardware puede afectar al **safety**, mientras que un atacante que modifica deliberadamente el comportamiento del sistema afecta al **security**.

Ambos aspectos pueden estar relacionados. Por ejemplo, un atacante que consigue modificar un sistema de control industrial podría provocar una situación peligrosa.

---

### Ejemplo integrador
<!-- .slide: style="font-size: 0.80em" -->
Consideremos un sistema de control de una central eléctrica:
- **Fiabilidad:** debe funcionar correctamente durante largos períodos.
- **Disponibilidad:** debe estar operativo cuando se necesita controlar la instalación.
- **Safety:** una falla no debe provocar una situación peligrosa.
- **Security:** una persona no autorizada no debe poder modificar el sistema.
- **Confiabilidad:** el conjunto de estas propiedades permite confiar en que el sistema prestará su servicio de manera adecuada.

Por lo tanto, en un sistema crítico no alcanza con que el sistema "funcione". Es necesario determinar qué ocurre cuando algo falla, cuando el sistema es atacado y cuando se producen situaciones inesperadas.

---

### Fiabilidad y Seguridad
<!-- .slide: style="font-size: 0.80em" -->
Hay 4 razones por las que los sistemas de software que son fiables no necesariamente son seguros:
1. Nunca se puede tener una total certeza de que un sistema de software esté libre de
fallas en el desarrollo y sea tolerante a los mismos. 
2. La especificación podría estar incompleta en cuanto a que no describe el comportamiento requerido 
del sistema en algunas situaciones críticas.
3. El mal funcionamiento del hardware origina que el sistema se comporte de forma
impredecible, y presente al software con un entorno no anticipado.
4. Los operadores del sistema pueden generar entradas que no son individualmente incorrectas, 
pero que, en ciertas situaciones, conducirían a un mal funcionamiento del sistema.

----

### Seguridad
Tipos de amenazas a la seguridad:
1. Amenazas a la confidencialidad del sistema y sus datos. Pueden difundir información a individuos o programas que no están autorizados a tener acceso a dicha información.
2. Amenazas a la integridad del sistema y sus datos, pueden dañar o
corromper el software o sus datos.
3. Amenazas a la disponibilidad del sistema y sus datos. Pueden
restringir el acceso al software o sus datos a usuarios autorizados.

----

### Seguridad
Controles para mejorar la seguridad del sistema:
1. **Evitar la vulnerabilidad:** Garantizar que los ataques no tengan éxito. 
2. **Detectar y neutralizar ataques:** Incluir funcionalidad de monitoreo de patrones de actividad inusuales para toman acciones.
3. **Limitar la exposición y recuperación:** Estrategias de respaldo automatizadas, réplica de  información.

---

### Vocabulario de sistemas críticos
<!-- .slide: style="font-size: 0.75em" -->
- **Accidente (o contratiempo):** Evento no planeado que derivan en muerte
o lesión de un individuo, o daño a la propiedad o al ambiente. Ej: Sobredosis de insulina.
- **Peligro:** Condición con el potencial para causar o contribuir a un accidente.
Ej. Riesgo de falla del sensor que mide glucosa sanguínea.
- **Daño:** Medida de la pérdida que resulta de un contratiempo. Variar desde muerte
hasta lesión o daño menor a la propiedad. Ej. Daño producto de una sobredosis de insulina
- **Severidad del peligro:** Valoración del peor daño posible que resultaría de un peligro
en particular. Puede ser catastrófico hasta menor.
- **Probabilidad del peligro:** Puede ser probable, improbable o baja la probabilidad.
- **Riesgo:** Medida de probabilidad de que el sistema causará un accidente. Se considera la posibilidad, severidad y verosimilitud de que el peligro conduzca a un accidente.

---

### Vocabulario de Seguridad
- **Activo:** Algo de valor que debe protegerse. Sería el sistema de software en sí
o los datos usados por el sistema.
- **Exposición:** Posible pérdida o daño a un sistema. sus datos, o pérdida de tiempo y esfuerzo.
- **Vulnerabilidad:** Debilidad de un sistema que puede aprovecharse para causar pérdida o daño.
- **Ataque:** Aprovechamiento de una vulnerabilidad del sistema. 
- **Amenaza:** Circunstancias que tienen potencial para causar pérdida o daño. 
- **Control:** Medida de protección que reduce la vulnerabilidad de un sistema. Ej. Encriptación.

### ISO 25010
Las Normas ISO son estándares internacionales creados por la Organización Internacional de Normalización (ISO) para asegurar la calidad, seguridad y eficiencia de productos, servicios y sistemas.

La ISO/IEC 25010 es un estándar internacional que define un modelo de calidad para evaluar productos de software y sistemas. 

----

### ISO 25010
Se encuentra compuesto por 9 características de calidad y a su vez cada una posee subcaracterísticas:
1. Adecuación Funcional
2. Eficiencia de Desempeño
3. Compatibilidad
4. Capacidad de Interacción
5. Fiabilidad
6. Seguridad
7. Mantenibilidad
8. Flexibilidad
9. Protección

---

### ISO 25010: Fiabilidad
<!-- .slide: style="font-size: 0.80em" -->
Capacidad de un software o componente para desempeñar las funciones especificadas, cuando se usa bajo unas condiciones y periodo de tiempo determinados sin interrupciones o fallos.
- **Ausencia de fallos.** Capacidad del sistema de llevar a cabo sus funciones sin fallos bajo condiciones normales de operación.
- **Disponibilidad.** Capacidad del sistema o componente de estar operativo y accesible para su uso cuando se requiere.
- **Tolerancia a fallos.** Capacidad del sistema o componente para operar según lo previsto en presencia de fallos hardware o software.
- **Capacidad de recuperación.** Capacidad del producto software para recuperar los datos directamente afectados y reestablecer el estado deseado del sistema en caso de interrupción o fallo.

----

### Fiabilidad: Indicadores
- Disponibilidad del sistema: 99,9 % o superior
- MTBF (tiempo medio entre fallos): 720 horas o superior
- Tiempo de recuperación: < 5 minutos
- Densidad de defectos: < 0,1/KLOC (miles de líneas de código)

---

### ISO 25010: Seguridad
Capacidad de protección de la información y los datos de manera que las personas u otros productos tengan el grado de acceso a los datos adecuado a sus tipos y niveles de autorización, y para defenderse de los patrones de ataque de agentes malintencionados.

----

### ISO 25010: Seguridad
<!-- .slide: style="font-size: 0.80em" -->
- **Confidencialidad.** Capacidad de asegurar que los datos sólo son accesibles a aquellos con autorización para ello.
- **Integridad.** Capacidad de un software para garantizar que el estado de su sistema y sus datos están protegidos frente a modificaciones o eliminaciones no autorizadas, ya sea por acciones malintencionadas o por errores informáticos.
- **No repudio.** Capacidad de demostrar las acciones o eventos que han tenido lugar, de manera que dichas acciones o eventos no puedan ser repudiados posteriormente.
- **Responsabilidad.** Capacidad de rastrear de forma inequívoca las acciones de una entidad.
- **Autenticidad.** Capacidad de un producto para demostrar que la identidad de un sujeto o recurso es la que se afirma.
- **Resistencia.** Capacidad de mantener la operación de un producto bajo condiciones de ataque de un actor malicioso.

----

### Seguridad: Indicadores
- Puntuación de vulnerabilidades: CVSS < 4,0
- Cobertura de cifrado: 100 %
- Control de acceso: basado en roles (RBAC)
- Cumplimiento de auditoría: SOC 2 Tipo II (Service Organization Control)

---

### ISO 25010: Protección
Es la capacidad del software, en condiciones definidas, de evitar un estado en el que se ponga en peligro la vida humana, la salud, la propiedad o el medio ambiente.

----

### ISO 25010: Protección
<!-- .slide: style="font-size: 0.80em" -->
- **Restricción operativa.** Capacidad de un producto para limitar su funcionamiento a unos parámetros o estados seguros cuando se enfrenta a un peligro operativo.
- **Identificación de riesgos.** Capacidad de un producto para identificar situaciones u operaciones que pueden exponer la vida, la propiedad o el medio ambiente a un riesgo inaceptable.
- **Protección ante fallos.** Capacidad de un producto para ponerse automáticamente en un modo de funcionamiento seguro o para volver a una condición segura en caso de fallo.
- **Advertencia de peligro.** Capacidad de un producto para alertar de riesgos inaceptables, de modo que puedan reaccionar con tiempo suficiente para mantener la seguridad de las operaciones.
- **Integración segura.** Capacidad de un producto para mantener la seguridad durante y después de la integración con uno o varios componentes.

### Actividad
<!-- .slide: style="font-size: 0.90em" -->
Acorde al ISO 25010 asigne una categoría y sub-categoría a cada una de estas situaciones:

1. Un servidor hospitalario deja de funcionar y otro asume automáticamente sus tareas.
2. Un usuario intenta consultar el historial clínico de un paciente que no tiene asignado y el sistema rechaza la solicitud.
3. Un sistema industrial detecta que un sensor proporciona valores fuera del rango esperado.
4. Después de una interrupción eléctrica, el sistema reinicia y recupera automáticamente las operaciones pendientes.

----

5. Un operador modifica un parámetro crítico y el sistema registra quién lo hizo, cuándo y qué modificó.
6. Una aplicación bancaria permite consultar información financiera únicamente después de verificar la identidad del usuario.
7. Un sistema de control detecta una condición peligrosa y detiene automáticamente la máquina.
8. Un sistema continúa funcionando aunque uno de sus componentes internos deje de funcionar.
9. Un usuario modifica información y posteriormente niega haber realizado la modificación. El sistema puede demostrar quién la realizó.

----

10. Antes de una operación, el sistema analiza las condiciones y determina si existe una situación que podría poner en peligro a una persona.
11. Un servicio debe estar disponible 24 horas y recuperarse en menos de cinco minutos ante una interrupción.
12. Solo determinados usuarios pueden acceder a información confidencial.
13. Un sistema ferroviario no puede determinar correctamente la posición de un tren y bloquea nuevos movimientos hasta disponer de información válida.

----

14. El sistema registra todas las acciones de los operadores para determinar quién realizó cada operación.
15. Una aplicación continúa funcionando ante una gran cantidad de solicitudes maliciosas destinadas a saturarla.
16. El sistema detecta que una operación podría provocar un estado peligroso y limita los valores que pueden introducirse.
17. El sistema genera una alarma cuando detecta una condición que podría representar un peligro para los operadores.

----

18. Se utilizan dos sensores independientes para controlar una variable crítica; si uno falla, se utiliza el otro.
19. Un sistema deja de responder durante 30 segundos, pero pasa automáticamente a un estado seguro.
20. Un atacante modifica deliberadamente la temperatura máxima permitida de una máquina.
21. Un sensor deja de funcionar y el sistema continúa utilizando el último valor recibido.

### ¿Qué es un modelo?

<!--https://diagramasuml.com/-->

Un **modelo es una abstracción** de un sistema o entidad del mundo real. 

Una **abstracción es una simplificación**, que incluye solamente aquellos detalles que resulten relevantes para un determinado propósito.

----

### Modelado de Sistemas
Los sistemas software pueden ser **complejos** y contener una gran cantidad de información. 

El **modelado** permite abordar esa complejidad mediante representaciones simplificadas que facilitan su comprensión, análisis, comunicación y documentación.

----

### Modelado de Sistemas
Por ejemplo, una aplicación puede describirse desde diferentes perspectivas:
- qué elementos existen en el sistema
- con quién se relaciona
- qué información maneja
- qué hace cuando recibe determinados estímulos
- cómo se organizan sus componentes

Cada una de estas perspectivas puede representarse mediante un modelo diferente.

---

### El modelado de sistemas
El **modelado de sistemas** es el proceso de elaborar modelos abstractos de un sistema.

Cada modelo presenta una **vista o perspectiva** diferente del sistema y permite concentrarse en determinados aspectos sin tener que considerar toda su complejidad al mismo tiempo.

El modelado de sistemas suele utilizar **notaciones gráficas**, entre ellas las definidas por el **Lenguaje Unificado de Modelado (UML)**.

----

### El modelado de sistemas
Los modelos pueden utilizarse durante distintas actividades de la ingeniería de software:
- comprender el sistema
- analizar los requisitos
- comunicar ideas con clientes y usuarios
- discutir alternativas de diseño
- documentar el sistema
- facilitar el desarrollo y mantenimiento del software

Un mismo sistema puede representarse mediante distintos modelos porque cada modelo responde preguntas diferentes.

----

### Ejemplo: Código Java
````java
package codemodel;
public class Guitarist extends Person implements MusicPlayer {
    Guitar favoriteGuitar;
      public Guitarist (String name) {super(name);}
            //A couple of local methods for accessing the class's properties
      public void setInstrument(Instrument instrument) {
            if(instrument instanceof Guitar){
                this.favoriteGuitar = (Guiter) instrument;
            } else {
                System.out.println("I'm not playing that thing!");
            }
      }
      public Instrument getInstrument() {return this.favoriteGuitar;}
}
````
* Representa sólo la lógica e ignora el resto
* El ser humano lo interpreta muy lentamente
* No facilita la reutilización ni la comunicación

### Diferentes perspectivas de un mismo sistema

Una forma de organizar el modelado es preguntarnos qué queremos conocer acerca del sistema.

| Perspectiva |	Pregunta principal |
|-------------|--------------------|
| Contexto	  | ¿Dónde está el sistema y con quién se relaciona? |
| Comportamiento |	¿Qué hace el sistema y cómo responde? |
| Datos |	¿Qué información maneja? |
| Objetos	| ¿Qué elementos componen el sistema y cómo se relacionan? |

Estas perspectivas no son independientes. Se complementan para construir una comprensión más completa del sistema.

----

### Diferentes perspectivas de un mismo sistema
<!-- .slide: style="font-size: 0.85em" -->
Por ejemplo, para analizar una aplicación de avistaje de fauna podríamos preguntarnos:
- **Contexto:** ¿con qué usuarios, organizaciones o sistemas externos interactúa?
- **Comportamiento:** ¿qué sucede cuando un usuario registra un avistaje?
- **Datos:** ¿qué información se almacena sobre una especie, un sitio o una observación?
- **Objetos:** ¿qué clases representan esos conceptos y cómo se relacionan?

De esta manera, los modelos no deben entenderse como diagramas aislados, sino como diferentes vistas de un mismo sistema.

---

### El uso de modelos gráficos

Los modelos gráficos pueden utilizarse con diferentes propósitos.
- Como herramienta de comunicación
- Como documentación
- Como descripción detallada

----

### Modelos gráficos como comunicación

Un modelo puede facilitar la discusión sobre el sistema entre desarrolladores, clientes, usuarios y otros interesados.

Una representación gráfica puede permitir que distintas personas compartan una misma visión sobre el sistema.

----

### Modelos gráficos como documentación

Un modelo puede utilizarse para documentar determinados aspectos del sistema.

En este caso, el modelo debe representar correctamente aquello que pretende describir, aunque no necesariamente tiene que representar todos los detalles del sistema.

----

### Modelos gráficos como descripción detallada

Cuando el objetivo es utilizar el modelo como una especificación detallada, se requiere un mayor nivel de precisión y completitud.

Por lo tanto, un modelo no necesariamente tiene que contener toda la información del sistema. Su nivel de detalle depende del propósito para el cual se construye.

---

### Modelo de contexto
Los **modelos de contexto** muestran el sistema y su relación con otros sistemas que forman parte de su entorno.

Su principal **objetivo** es ayudar a establecer los **límites del sistema**, es decir, determinar qué elementos y funcionalidades forman parte del sistema que se está desarrollando y cuáles quedan fuera de él.

El contexto permite observar el sistema desde una **perspectiva externa**, sin entrar todavía en el detalle de su funcionamiento interno.

----

### Modelo de contexto: Límites

Los límites del sistema establecen qué está dentro y qué está fuera del sistema.

En un modelo de contexto pueden representarse:
- el sistema que se está desarrollando
- otros sistemas relacionados
- elementos externos que interactúan con el sistema

La decisión sobre dónde situar los límites del sistema es importante porque tiene consecuencias sobre los **requisitos** y sobre la distribución del trabajo.

----

### Modelo de contexto: Límites
La posición de los límites puede estar influenciada no solamente por cuestiones técnicas, sino también por cuestiones organizacionales.

Por ejemplo, una determinada funcionalidad podría considerarse parte del sistema en una organización y responsabilidad de otro sistema o área en otra organización.

Por este motivo, definir los límites del sistema es una decisión relevante durante la ingeniería de requisitos.

---

### Diagrama de contexto

El diagrama de contexto proporciona una visión general del sistema y de los elementos externos con los que se relaciona.

En esta etapa interesa principalmente responder:

**¿Qué está dentro del sistema y qué está fuera?**

No se pretende describir en detalle cómo se realizan las operaciones internas.

### Limitaciones del modelo de contexto
<!-- .slide: style="font-size: 0.90em" -->
Un modelo de contexto permite identificar los elementos del entorno que se relacionan con el sistema, pero no muestra ampliamente cómo se producen esas relaciones ni cómo se utiliza el sistema dentro de los procesos del entorno.

Por esta razón, el modelo de contexto debe complementarse con otros modelos.

Por ejemplo, los **modelos de procesos** permiten representar cómo se utiliza el sistema dentro de procesos de negocio.

Los **diagramas de actividad** de UML pueden utilizarse para representar este tipo de procesos.

---

### Modelo de comportamiento

Los **modelos de comportamiento** representan el comportamiento dinámico de un sistema durante su ejecución.

Mientras que un modelo estructural permite observar cómo está organizado el sistema, un modelo de comportamiento permite analizar:

**¿Qué sucede cuando el sistema recibe un estímulo?**

----

### Modelo de comportamiento: Estimulos
Los estímulos pueden estar relacionados con:
- datos que ingresan al sistema
- eventos externos
- eventos internos
- acciones realizadas por usuarios
- interacciones con otros sistemas

Los modelos de comportamiento permiten estudiar cómo responde el sistema ante estos estímulos.

---

### Diferentes formas de modelar el comportamiento
El comportamiento de un sistema puede analizarse desde distintas perspectivas.

- **Interacción**, que se concentra en el intercambio de mensajes o acciones entre los participantes.
- **Procesamiento**, que se concentra en la secuencia de actividades que se realizan para transformar entradas en resultados.
- **Respuesta a eventos y cambios de estado**, especialmente importante en sistemas cuyo comportamiento depende de eventos externos o internos.

Dentro del modelado de comportamiento encontramos diferentes tipos de modelos.

---

### Modelos de interacción
<!-- .slide: style="font-size: 0.85em" -->
Los **modelos de interacción** representan las interacciones que se producen entre los participantes de un sistema.

Puede analizar diferentes situaciones:
- **Interacción usuario-sistema:** Permite comprender cómo los usuarios utilizan el sistema y ayuda a identificar sus necesidades.
- **Interacción sistema-sistema:** Permite analizar la comunicación entre sistemas y detectar posibles problemas relacionados con el intercambio de información.
- **Interacción entre componentes:** Permite estudiar cómo se comunican los diferentes componentes de un sistema y analizar si la estructura propuesta puede satisfacer los requisitos de rendimiento y fiabilidad.

----

### Modelos de interacción
Entre los diagramas UML utilizados para representar interacciones se encuentran:
- diagramas de casos de uso
- diagramas de secuencia

---

### Modelado de procesos
<!-- .slide: style="font-size: 0.90em" -->
Los **diagramas de actividad** de UML pueden utilizarse para representar procesos y flujos de actividades.

En este tipo de modelo interesa responder preguntas como:
- ¿Qué actividades se realizan?
- ¿En qué orden?
- ¿Qué decisiones existen?
- ¿Qué actividades pueden ejecutarse en paralelo?
- ¿Cómo termina el proceso?

Los diagramas de actividad también pueden utilizarse para representar el procesamiento de datos dentro de un sistema.

### Modelado impulsado por datos

En estos modelos  el comportamiento está determinado principalmente por los datos que ingresan al sistema y por las transformaciones que se realizan sobre ellos.

Los modelos impulsados por datos muestran
- las entradas al sistema
- las acciones realizadas sobre esas entradas
- la secuencia del procesamiento
- las salidas producidas

----

### Modelado impulsado por datos
Estos modelos son particularmente útiles durante el análisis de requisitos porque permiten representar el procesamiento de extremo a extremo.

Los diagramas de actividad pueden utilizarse para representar este tipo de procesamiento.

----

### Modelado impulsado por eventos

Los sistemas de tiempo real pueden estar determinados principalmente por eventos.

En estos casos, el sistema responde a acontecimientos externos o internos.

----

### Modelado impulsado por eventos
El modelado impulsado por eventos parte de la idea de que un sistema puede encontrarse en diferentes estados y que determinados eventos provocan transiciones entre esos estados.

Por ejemplo, un sistema puede pasar de un estado "Esperando" a un estado "En funcionamiento" cuando ocurre un evento determinado.

Esto conduce al concepto de máquina de estados.

---

### Modelos de máquina de estados

Los modelos de **máquina de estados** representan el comportamiento de un sistema en respuesta a eventos externos o internos.

Resultan especialmente útiles cuando:
- el comportamiento depende del estado actual
- determinados eventos producen cambios de estado
- el sistema debe responder de manera diferente dependiendo de su estado

----

### Modelos de máquina de estados
En una máquina de estados:
- los estados representan situaciones en las que puede encontrarse el sistema;
- los eventos o estímulos provocan cambios;
- las transiciones representan el paso de un estado a otro.

Por lo tanto:
**Evento → transición → nuevo estado**

Estos modelos son especialmente relevantes para sistemas cuyo comportamiento está determinado por eventos, como muchos sistemas de tiempo real.

### Modelos estructurales

Muestran la **organización** de un sistema en función de los **componentes** que lo conforman y de las **relaciones** entre ellos.

Proporcionan una visión principalmente estática del sistema.

Dentro de esta perspectiva pueden distinguirse:
- **modelos de datos** → estructura de la información
- **modelos de objetos** → estructura de los elementos del sistema desde una perspectiva orientada a objetos.

---

### Modelo de datos
<!-- .slide: style="font-size: 0.85em" -->
Representan cómo se organizan, estructuran y relacionan los datos de un sistema.

Su objetivo es describir la estructura estática de la información.

Un modelo de datos puede representar:
- entidades
- atributos
- relaciones
- cardinalidades
- reglas de integridad

Estos modelos son utilizados, para el diseño de bases de datos y para representar cómo se organiza la información que debe almacenar el sistema.

----

### Modelo de datos: Ejemplos
Entre las técnicas utilizadas para representar datos se encuentran:
- modelo entidad-relación (ER)
- modelos relacionales, basados en tablas y claves
- otras representaciones destinadas a describir la estructura de almacenamiento de información

Los modelos de datos permiten analizar cómo se relaciona la información y constituyen una base para actividades como el diseño y la normalización de bases de datos.

---
### Modelo de objetos
<!-- .slide: style="font-size: 0.82em" -->
Rrepresenta los elementos de un sistema desde la perspectiva de la programación orientada a objetos.

Permite representar:
- clases
- objetos
- atributos
- operaciones o métodos
- asociaciones
- herencia
- composición y otras relaciones

Un modelo de objetos busca representar los elementos que forman parte del sistema y las relaciones y responsabilidades asociadas a ellos.

----

### Clases y objetos
<!-- .slide: style="font-size: 0.82em" -->
Una **clase** es una definición general de un tipo de objeto del sistema.

Un **objeto** es una instancia concreta de una clase.

Por ejemplo, en un sistema de gestión médica podrían existir clases como:
- Paciente
- Médico
- Consulta
- Prescripción

Una clase puede definir atributos y operaciones que caracterizan a sus objetos.

Las clases también pueden relacionarse mediante asociaciones.

----

### Diagramas de clases
<!-- .slide: style="font-size: 0.82em" -->
Se utilizan en el desarrollo de modelos de sistemas orientados a objetos para representar:
- las clases del sistema
- sus atributos
- sus operaciones
- las asociaciones entre clases
- otras relaciones entre ellas

Permite observar la estructura del sistema desde una perspectiva orientada a objetos.

El estudio detallado de clases, atributos, métodos, asociaciones, multiplicidades, herencia y demás elementos de notación se desarrolla en las diapositivas específicas de diagramas de clases.

---

### Relación entre los diferentes modelos

Los distintos modelos no representan sistemas independientes.

Todos pueden utilizarse para estudiar diferentes aspectos de un mismo sistema.

### Métodos estructurados
Son enfoques de desarrollo que organizan el análisis y el diseño alrededor de determinadas técnicas de modelado.

Estos métodos se desarrollaron antes del predominio de la orientación a objetos y ponen énfasis en:
- la descomposición funcional
- el flujo de datos
- el control del procesamiento
- la organización jerárquica de las funciones

----

#### Procesamiento de pedidos

![Procesamiento de pedidos](images/u8-UML/procesamiento_de_pedidos.jpg)

----

### Métodos estructurados: Características
Los métodos estructurados se caracterizan por:
- **Orientación a funciones:** El sistema se descompone en procesos o funciones, en lugar de organizarse principalmente alrededor de objetos y clases.
- **Descomposición jerárquica:** El sistema puede dividirse progresivamente en partes más pequeñas hasta alcanzar un nivel de detalle adecuado.
- **Separación entre análisis y diseño:** Se distingue entre el estudio de lo que el sistema debe hacer y la definición de cómo se organizará su solución.

----

### Métodos estructurados: técnicas de modelado

Entre las herramientas asociadas a estos métodos se encuentran:
- Diagramas de flujo de datos (DFD)
- diccionarios de datos
- pseudocódigo
- tablas de decisión
- árboles de decisión
- diagramas de estructura

---

### Diferencia entre métodos estructurados y orientación a objetos
<!-- .slide: style="font-size: 0.82em" -->
Los **métodos estructurados** y el enfoque orientado a objetos representan diferentes formas de organizar el análisis y diseño.

En un enfoque estructurado, el sistema se analiza mediante:

**procesos + funciones + flujo de datos**

En un enfoque **orientado a objetos**, el análisis se organiza:

**objetos + clases + responsabilidades + relaciones**

Cada enfoque utiliza un conjunto de modelos y técnicas que responden a una determinada forma de comprender y descomponer el sistema.

---

### Ingeniería dirigida por modelos
<!-- .slide: style="font-size: 0.90em" -->
La Ingeniería Dirigida por Modelos **(MDE, Model-Driven Engineering)** constituye un enfoque en el que los modelos tienen un papel central durante el desarrollo del software.

En este enfoque, los modelos no son únicamente documentación del sistema, sino que pueden constituir artefactos principales del proceso de desarrollo.

----

### Ingeniería dirigida por modelos
Una de las ideas asociadas a MDE es que pueden generarse programas para determinadas plataformas a partir de modelos.

Esto permite trabajar a un nivel de abstracción superior al código de programación y reducir la dependencia directa de determinados lenguajes o plataformas durante algunas etapas del desarrollo.

----

### MDA: Model-Driven Architecture

**MDA (Model-Driven Architecture)** es una propuesta relacionada con el desarrollo dirigido por modelos.

Mientras que **MDA** se concentra especialmente en las etapas de diseño e implementación, **MDE** tiene un alcance más amplio sobre el proceso de ingeniería de software.

**MDA** propone trabajar con diferentes niveles de abstracción.

----

### MDA: CIM, PIM y PSM
<!-- .slide: style="font-size: 0.87em" -->
**MDA** propone tres tipos principales de modelos:
- **CIM — Computationally Independent Model o Modelo Independiente de Computación:** Representa las abstracciones importantes del dominio y permite describir el sistema sin centrarse en los detalles de su implementación computacional.
- **PIM — Platform Independent Model o Modelo Independiente de Plataforma:** Representa la operación del sistema sin hacer referencia a una plataforma concreta de implementación.
- **PSM — Platform Specific Model o Modelo Específico de Plataforma:** Representa el sistema considerando las características de una plataforma concreta.

----

### MDA: CIM, PIM y PSM
La idea general puede representarse como una progresión:

Dominio → modelo independiente de plataforma → modelo específico de plataforma → implementación

De esta manera, los modelos permiten trabajar progresivamente desde niveles más abstractos hacia niveles más próximos a la implementación.

----

![Proceso MDA](images/u8-UML/proceso_mda.png)

---

**No existe un único modelo capaz de explicar completamente un sistema complejo.**

Modelar consiste en seleccionar una perspectiva, abstraer los detalles que no son relevantes para ese propósito y representar aquellos aspectos que necesitamos comprender, comunicar o documentar.

Los diferentes modelos se complementan y permiten construir progresivamente una comprensión más completa del sistema software.
